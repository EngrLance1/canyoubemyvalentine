<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  background:
    radial-gradient(circle at top, #ffd6e8, transparent 60%),
    linear-gradient(135deg, #ff4d6d, #ff8fab);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: 'Poppins', sans-serif;
  transition: opacity 1.5s ease;
}

/* Floating hearts background */
.heart-bg {
  position: fixed;
  bottom: -20px;
  font-size: 20px;
  opacity: 0.6;
  animation: floatUp linear infinite;
  z-index: 0;
}
@keyframes floatUp {
  to { transform: translateY(-120vh); opacity: 0; }
}

/* Glass card */
.card {
  position: relative;
  z-index: 10;
  width: 92%;
  max-width: 420px;
  padding: 38px;
  border-radius: 30px;
  background: rgba(255,255,255,0.22);
  backdrop-filter: blur(22px);
  border: 1px solid rgba(255,255,255,0.35);
  box-shadow: 0 30px 60px rgba(0,0,0,0.35);
  text-align: center;
  animation: floatIn 1.4s ease;
}

@keyframes floatIn {
  from { opacity: 0; transform: translateY(60px) scale(0.92); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

h1 {
  font-family: 'Dancing Script', cursive;
  font-size: 42px;
  color: #fff;
  text-shadow: 0 0 20px rgba(255,255,255,0.9);
}

p {
  font-size: 17px;
  line-height: 1.7;
  color: #fff;
  white-space: pre-line;
}

.countdown {
  margin: 18px 0;
  font-family: 'Playfair Display', serif;
}

.buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
}

button {
  margin-top: 22px;
  padding: 14px 32px;
  font-size: 17px;
  border-radius: 50px;
  border: none;
  cursor: pointer;
  font-family: 'Playfair Display', serif;
  color: white;
  background: linear-gradient(135deg, #ff4d6d, #ff758c);
  box-shadow: 0 0 25px rgba(255,77,109,0.8);
}

button.no {
  background: linear-gradient(135deg, #ff9aa2, #ffc4d6);
  position: relative;
}

.place-img {
  width: 100%;
  border-radius: 20px;
  margin-top: 20px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.4);
}

/* Heart explosion */
.heart {
  position: fixed;
  font-size: 18px;
  pointer-events: none;
  animation: explode 1.6s ease forwards;
}

@keyframes explode {
  to {
    transform: translate(var(--x), var(--y)) scale(0);
    opacity: 0;
  }
}

/* Confetti */
.confetti {
  position: fixed;
  top: -10px;
  width: 10px;
  height: 14px;
  animation: fall linear forwards;
  z-index: 5;
}
@keyframes fall {
  to { transform: translateY(110vh) rotate(720deg); }
}

@media only screen and (max-width: 620px) {
/* For mobile phones: */
.menu, .main, .right {
width: 100%;
}
</style>
</head>

<body>

<audio id="music" loop>
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_0a0a0bb1b7.mp3">
</audio>
<audio id="pop">
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_0bfaac0a9c.mp3">
</audio>

<div class="card" id="card">
  <h1>Hey <span id="name"></span> 💕</h1>
  <p id="typed"></p>
  <div class="countdown" id="countdown"></div>

  <div class="buttons">
    <button onclick="yes()">Yes 💖</button>
    <button class="no" id="noBtn">No 🙄</button>
  </div>
</div>

<script>
/* ===== EDIT HERE ===== */
const herName = "Samantha";
const destination = "Lucianos' Cafe 🍝";
const placeImage = 'https://scontent.fmnl37-1.fna.fbcdn.net/v/t39.30808-6/482217288_549854931448080_6075815198504919402_n.jpg?_nc_cat=109&ccb=1-7&_nc_sid=127cfc&_nc_ohc=ICNUCdc2L1MQ7kNvwHpfVzJ&_nc_oc=AdkoWyXbDWFmEtRnVVjtYd76zhSQGgI4SGQIlEL9e5u2RGZOc_rFHyBKrVjPm-e_VkYfQrKlBlZhRjuOZ3_KVY-H&_nc_zt=23&_nc_ht=scontent.fmnl37-1.fna&_nc_gid=ccrLMZmRb9OWUfOVd_AWjA&oh=00_AfozvkXAzpDodlrpDwlLav_pH0p4gb1Yf3L9KHloHs-8AA&oe=69796494';
/* ==================== */

document.getElementById("name").textContent = herName;

/* Floating hearts background */
setInterval(() => {
  const h = document.createElement("div");
  h.className = "heart-bg";
  h.textContent = "💗";
  h.style.left = Math.random()*100+"vw";
  h.style.animationDuration = Math.random()*4+6+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),10000);
}, 500);

/* Typing */
const text = `After your class, February 14 💘
Would you like to go on a date with me?`;
let i = 0;
(function type(){
  if(i < text.length){
    document.getElementById("typed").innerHTML += text.charAt(i++);
    setTimeout(type,45);
  }
})();

/* Countdown */
setInterval(()=>{
  const now=new Date();
  const t=new Date(now.getFullYear(),1,14);
  document.getElementById("countdown").textContent =
    `⏳ ${Math.floor((t-now)/86400000)} days to go`;
},1000);

/* NO button dodge */
const noBtn = document.getElementById("noBtn");
noBtn.addEventListener("mouseenter", () => {
  noBtn.style.transform =
    `translate(${Math.random()*120-60}px, ${Math.random()*120-60}px)`;
});

/* YES / NO */
function yes(){ proceed(); }
noBtn.onclick = () => proceed(true);

function proceed(isNo){
  document.getElementById("music").play();
  confetti();
  heartExplosion();

  document.getElementById("card").innerHTML = `
    <h1>${isNo ? "Nice try 😏" : "Yay 💞"}</h1>
    <p>${isNo ? "You’re still coming though." : "I’m happy you said yes 🥰"}</p>
    <button onclick="reveal()">Where are we going? 😌</button>
  `;
}

/* Reveal place */
function reveal(){
  document.getElementById("card").innerHTML = `
    <h1>Our Date ✨</h1>
    <p>📍 ${destination}</p>
    <img class="place-img" src="${placeImage}">
    <p>I’m really looking forward to it 💕</p>
  `;
  setTimeout(exitSite, 5000);
}

/* Exit site */
function exitSite(){
  document.body.style.opacity = 0;
  setTimeout(()=>window.location.href="about:blank",1500);
}

/* Heart explosion */
function heartExplosion(){
  for(let i=0;i<30;i++){
    const h=document.createElement("div");
    h.className="heart";
    h.textContent="💖";
    h.style.left="50vw";
    h.style.top="50vh";
    h.style.setProperty("--x",`${Math.random()*300-150}px`);
    h.style.setProperty("--y",`${Math.random()*300-150}px`);
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),1600);
  }
}

/* Confetti */
function confetti(){
  document.getElementById("pop").play();
  for(let i=0;i<120;i++){
    const c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=`hsl(${Math.random()*360},100%,60%)`;
    c.style.animationDuration=Math.random()*2+2+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),4000);
  }
}
</script>

</body>
</html>
